<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>Week 2</title>
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <h1><a href="">สินค้า</a></h1>
    

    <nav>
      <a href="">ตะกร้าตัวอย่าง</a>
    </nav>

    <form method="get" class="interest-form">
      <div class="field">
          <label for="product">สินค้าที่สนใจ</label>
          <select id="product" name="productId">
            <div id="catalog">
              <option value="notebook">Notebook</option>
              <option value="pen">Pen</option>
            </div>

          </select>
      </div>
      <div class="field">
          <label for="quantity">จำนวนที่สนใจ</label>
            <input
          type="number"
          id="quantity"
          name="quantity"
          value="2"
          min="1"
          required
        />
      </div>
      <button type="submit">ทดลองส่งข้อมูล</button>
      <button type="reset">คืนค่าเริ่มต้น</button>
      <a href="#">เริ่มตัวอย่างใหม่</a>
    </form>

    <h2>รายการสินค้า</h2>
  </body>
</html>
