<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <title>Week 2</title>
  </head>
  <body>
    <h1>สินค้า</h1>

    <form method="get">
      <label for="product">สินค้าที่สนใจ</label>
      <select id="product" name="productId">
        <option value="notebook">Notebook</option>
      </select>

      <label for="quantity">จำนวนที่สนใจ</label>
      <input
        type="number"
        id="quantity"
        name="quantity"
        value="2"
        min="1"
        required
      />

      <button type="submit">ทดลองส่งข้อมูล</button>
    </form>

    <h2>รายการสินค้า</h2>
  </body>
</html>
